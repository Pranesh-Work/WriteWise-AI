<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Banking Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
    <div>
        <h1>SimpleBank</h1>
        <p>OOP Banking Dashboard</p>
    </div>
    <button id="refreshBtn" class="secondary">Refresh</button>
</header>

<main class="container">
    <section class="hero">
        <div>
            <span class="badge">JAVA REST API</span>
            <h2>Welcome to your banking dashboard</h2>
            <p>Manage deposits, withdrawals and account information.</p>
        </div>
        <div class="status" id="status">Connecting...</div>
    </section>

    <section class="grid" id="accounts"></section>

    <section class="panel">
        <h2>Make a Transaction</h2>
        <form id="transactionForm">
            <label>
                Account
                <select id="accountId" required></select>
            </label>
            <label>
                Transaction
                <select id="operation">
                    <option value="deposit">Deposit</option>
                    <option value="withdraw">Withdraw</option>
                </select>
            </label>
            <label>
                Amount
                <input id="amount" type="number" min="0.01" step="0.01" placeholder="500" required>
            </label>
            <button type="submit">Submit Transaction</button>
        </form>
        <div id="message" class="message"></div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
